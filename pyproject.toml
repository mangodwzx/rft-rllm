[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rft-rllm-baselines"
version = "0.1.0"
description = "Official rLLM offline/iterative RFT and GRPO pass@k baselines"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.scripts]
rft-rllm = "rft_rllm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F"]
